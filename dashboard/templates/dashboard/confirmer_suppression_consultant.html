<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation de suppression</title>
    <!-- Intégration de Tailwind CSS pour un design moderne et professionnel -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md mx-4">
        <div class="bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden p-8 text-center">
            
            <!-- Icône d'avertissement -->
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-red-50 text-red-600 mb-6">
                <svg class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
            </div>

            <!-- Titre et Message -->
            <h2 class="text-xl font-bold text-slate-900 mb-2">Confirmer la suppression</h2>
            <p class="text-sm text-slate-500 mb-6">
                Êtes-vous sûr de vouloir supprimer définitivement le consultant <span class="font-semibold text-slate-700">{{ consultant.nom }}</span> ? Cette action est irréversible.
            </p>

            <!-- Formulaire d'action -->
            <form method="post" class="flex flex-col sm:flex-row gap-3 justify-center">
                {% csrf_token %}
                <a href="{% url 'liste_consultants' %}" class="w-full sm:w-auto px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 font-medium text-sm hover:bg-slate-50 transition-colors text-center">
                    Annuler
                </a>
                <button type="submit" class="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-red-600 text-white font-medium text-sm hover:bg-red-700 shadow-lg shadow-red-600/20 transition-all text-center">
                    Oui, supprimer
                </button>
            </form>

        </div>
    </div>

</body>
</html>
