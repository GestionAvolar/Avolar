{% extends 'dashboard/base.html' %}
{% block content %}
<div class="container py-5">
    <div class="card shadow-sm border-0 p-4 col-md-8 mx-auto">
        <h4 class="mb-4 text-success">Modifier le projet : {{ projet.nom }}</h4>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Enregistrer les modifications</button>
            <a href="{% url 'detail_projet' projet.id %}" class="btn btn-outline-secondary w-100 mt-2">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
