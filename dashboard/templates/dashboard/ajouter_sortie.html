{% extends 'dashboard/base.html' %}

{% block content %}
<div class="card shadow p-4 mx-auto" style="max-width: 600px;">
    <h3 class="text-danger mb-4 text-center">📤 Nouvelle Sortie d'Argent</h3>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            {{ form.as_p }}
        </div>
        <button type="submit" class="btn btn-danger btn-lg w-100 mt-3">Enregistrer la Sortie</button>
        <a href="{% url 'finance_view' %}" class="btn btn-outline-secondary w-100 mt-2">Annuler</a>
    </form>
</div>
{% endblock %}
