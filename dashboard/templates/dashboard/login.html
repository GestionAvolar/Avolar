{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion | Votre Système</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4 shadow" style="width: 400px;">
            <div class="text-center mb-4">
                <!-- Remplacement par ton logo fond.jpg -->
                <img src="{% static 'img/fond.jpg' %}" alt="Logo" class="img-fluid rounded-circle shadow-sm mb-2" style="width: 90px; height: 90px; object-fit: cover;">
                <h4 class="mt-2">Bienvenue</h4>
                <p class="text-muted">Veuillez vous connecter pour accéder au système</p>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    {{ form.username.label_tag }}
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="form-group">
                    {{ form.password.label_tag }}
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Connexion</button>
            </form>
        </div>
    </div>
</body>
</html>
