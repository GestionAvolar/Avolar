{% extends 'dashboard/base.html' %}
{% block content %}
<div class="container py-4 text-center">
    <div class="card shadow p-4 border-danger">
        <h4 class="text-danger">Confirmation</h4>
        <p>Êtes-vous sûr de vouloir supprimer le matériel <strong>{{ materiel.no_reference }}</strong> ?</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Oui, supprimer définitivement</button>
            <a href="{% url 'liste_materiels' %}" class="btn btn-secondary">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
