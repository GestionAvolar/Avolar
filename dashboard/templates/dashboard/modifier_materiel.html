{% extends 'dashboard/base.html' %}
{% block content %}
<div class="container py-4">
    <div class="card shadow p-4">
        <h4 class="text-warning">Modifier : {{ materiel.no_reference }}</h4>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-warning">Enregistrer</button>
            <a href="{% url 'liste_materiels' %}" class="btn btn-secondary">Annuler</a>
        </form>
    </div>
</div>
{% endblock %}
