{% extends 'dashboard/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card shadow-sm border-0 rounded-4" style="max-width: 600px; margin: auto;">
        <div class="card-body p-5">
            <h3 class="text-success fw-bold mb-4 text-center">📥 Enregistrer une Entrée</h3>
            <p class="text-muted text-center mb-4">Veuillez remplir les détails de la transaction.</p>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    {{ form.as_p }}
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success btn-lg rounded-pill shadow-sm">
                        Valider l'opération
                    </button>
                    <a href="{% url 'finance_view' %}" class="btn btn-link text-secondary">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
