{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Système de Gestion - AVOLAR</title>
    
    <!-- Configuration PWA (Manifeste et Couleur de thème) -->
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <meta name="theme-color" content="#198754">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            background-color: #e0e0e0; 
        }
        body::before {
            content: ""; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background-image: url('{% static "images/fond.jpg" %}');
            background-size: cover; 
            background-position: right;
            filter: blur(1px) brightness(0.8); 
            z-index: -5;
        }

        /* --- Barre supérieure --- */
        .top-bar { 
            position: fixed; 
            top: 0; 
            left: 0; /* Par défaut plein écran sur mobile */
            right: 0; 
            height: 60px; 
            background: #ffffff; 
            border-bottom: 1px solid #dee2e6; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 15px; 
            z-index: 1040; 
        }

        /* --- Sidebar Desktop (Écrans moyens et larges) --- */
        .sidebar { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 250px; 
            height: 100vh; 
            background-color: #198754; 
            color: white; 
            padding: 20px; 
            z-index: 1050; 
            overflow-y: auto; 
            transition: transform 0.3s ease-in-out;
        }

        /* --- Contenu principal --- */
        .main-content { 
            margin-left: 0; /* Pleine largeur par défaut sur mobile */
            margin-top: 60px; 
            padding: 20px; 
            transition: margin-left 0.3s ease-in-out;
        }

        /* --- Styles spécifiques aux grands écrans (Desktop / Tablettes larges) --- */
        @media (min-width: 992px) {
            .top-bar {
                left: 250px; /* Décale la barre du haut pour laisser place à la sidebar */
                padding: 0 30px;
            }
            .main-content {
                margin-left: 250px; /* Décale le contenu */
                padding: 40px;
            }
            .mobile-menu-btn {
                display: none !important; /* Cache le bouton hamburger sur PC */
            }
        }

        .card { border: none; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); background-color: #ffffff; }
        .nav-link { color: #ffffff !important; font-weight: 500; padding: 12px 15px; border-radius: 8px; margin-bottom: 4px; transition: 0.3s; }
        .nav-link:hover { background-color: #146c43; }
        .sub-menu { padding-left: 20px; }
        .sub-menu .nav-link { font-size: 0.9em; background-color: #16774a; }
        input, select, textarea { width: 100%; padding: 0.75rem 1rem; margin-bottom: 15px; border: 1px solid #dee2e6; border-radius: 0.75rem !important; }
    </style>
</head>
<body>

<!-- Barre supérieure -->
<header class="top-bar shadow-sm">
    <div class="d-flex align-items-center">
        <!-- Bouton Hamburger visible uniquement sur mobile/tablette -->
        <button class="btn btn-success btn-sm me-3 mobile-menu-btn d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMobile" aria-controls="sidebarMobile">
            <i class="bi bi-list fs-5"></i>
        </button>
        <span class="fw-bold text-success text-truncate" style="font-size: 1.1rem;">Gestion AVOLAR</span>
    </div>
    <div class="d-flex align-items-center">
        <span class="fw-bold text-success me-2 me-md-3 small d-none d-sm-inline"><i class="bi bi-person-circle"></i> {{ user.username|default:"Administrateur" }}</span>
        <a href="{% url 'deconnexion' %}" class="btn btn-outline-danger btn-sm" title="Se déconnecter"><i class="bi bi-box-arrow-right"></i></a>
    </div>
</header>

<!-- NAVIGATION POUR GRANDS ÉCRANS (PC / Ordinateurs portables) -->
<nav class="sidebar d-none d-lg-block">
    <h5 class="text-center mb-4">Menu</h5>
    {% include "menu_items.html" with is_mobile=False %}
</nav>

<!-- NAVIGATION POUR SMARTPHONES ET TABLETTES (Fenêtre coulissante Offcanvas) -->
<div class="offcanvas offcanvas-start bg-success text-white" tabindex="-1" id="sidebarMobile" aria-labelledby="sidebarMobileLabel">
    <div class="offcanvas-header border-bottom border-success">
        <h5 class="offcanvas-title" id="sidebarMobileLabel"><i class="bi bi-list-nested"></i> Menu AVOLAR</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body p-3">
        {% include "menu_items.html" with is_mobile=True %}
    </div>
</div>

<!-- Contenu principal -->
<main class="main-content">
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Script d'enregistrement du Service Worker pour la PWA -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register("{% static 'sw.js' %}")
        .then((reg) => console.log('Service Worker enregistré avec succès !', reg))
        .catch((err) => console.log('Échec de l\'enregistrement du Service Worker :', err));
    });
  }
</script>

</body>
</html>
